kind = "web"
previewPath = "/"
title = "Revive Event Center"
version = "1.0.0"
id = "artifacts/revive-event-center"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22615

[services.development]
run = "pnpm --filter @workspace/revive-event-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/revive-event-center", "run", "build" ]
publicDir = "artifacts/revive-event-center/dist/public"
serve = "static"

# No catch-all rewrite: the site is one page, so unknown addresses should
# return "not found" (public/404.html) instead of the home page with 200.

[services.env]
PORT = "22615"
BASE_PATH = "/"
