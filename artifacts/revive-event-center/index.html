    <style>
      body { margin: 0; }
      .shell { font-family: Manrope, system-ui, sans-serif; color: #2c2620; background: #f9f7f1; }

      .shell-hero { position: relative; min-height: 88vh; padding: 80px 1.5rem 0; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; color: #fff; }

      .shell-hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 55%, rgba(0,0,0,.45), rgba(0,0,0,0) 75%), rgba(0,0,0,.4); }

      .shell-hero h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(2.6rem, 7vw, 6rem); line-height: 1.05; margin: 0 0 1.5rem; }

      .shell-facts { font-weight: 500; }
      .shell-ctas { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 2rem 0 1rem; }

      .shell-ctas .gold { background: #c9a777; color: #241c13; }

      .shell-body { max-width: 48rem; margin: 0 auto; padding: 4rem 1.5rem; line-height: 1.6; }
